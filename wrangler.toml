# Налаштування деплою KeyCRM MCP-воркера.
# Заливкою керує .github/workflows/deploy.yml — руками тут нічого запускати не треба.

name = "keycrm-mcp"
main = "src/keycrm-worker-v8.js"

# Дата «правил гри» середовища Cloudflare. Взята один в один з живого воркера
# (Settings → Runtime, знято 24.08.2026), щоб деплой не змінив поведінку.
# Прапорців сумісності у воркера немає — тут їх теж немає.
compatibility_date = "2026-05-24"

# Воркер доступний за адресою *.workers.dev — лишаємо як є.
workers_dev = true

# Секрети (KEYCRM_API_KEY, NP_API_KEY, MCP_SHARED_SECRET) живуть у Cloudflare
# і деплоєм коду не зачіпаються. Сюди їх не пишемо — тут вони були б відкритим текстом.
